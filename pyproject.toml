[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loophole"
version = "0.1.0"
description = "RL environments for LLM agents that ship an honest verifier and a leaky one, to measure when training finds the hole"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tanay Pratap Singh" }]
requires-python = ">=3.10"
# The core (environments, verifiers, sandbox, detectors, metrics) is stdlib plus
# numpy, pyyaml, and duckdb. Trainers and adapters are optional extras so CI
# runs the whole core in under a minute without a GPU stack.
dependencies = ["numpy>=1.26", "pyyaml>=6", "duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
pool = ["ray>=2.30"]
train = ["torch>=2.3", "transformers>=4.46", "trl>=0.19", "peft>=0.13", "datasets>=3.0", "accelerate>=1.0"]
inspect = ["inspect-ai>=0.3.100"]
data = ["datasets>=3.0"]

[project.scripts]
loophole = "loophole.cli:main"

[tool.setuptools.packages.find]
include = ["loophole*"]

[tool.setuptools.package-data]
"loophole" = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
