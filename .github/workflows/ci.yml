name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check loophole tests kaggle
      - run: pytest -q

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: docker build -t loophole-sandbox:0.1 -f docker/sandbox.Dockerfile .
      - run: loophole probe --backend all
      - uses: actions/upload-artifact@v4
        with:
          name: probes-linux
          path: runs/*-probe/
